<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Socket io Node JS</title>

	<style media="screen">
		form {
			position: absolute;
			bottom: 0px;
			width: 100%;
			background: seagreen;
			padding: 20px;
		}

		input {
			float: left; 
			width: 70%; 
			height: 30px;
			border: none;
		}

		button {
			float: left;
			width: 20%;
			height: 35px;
		}
	</style>
</head>
<body>

	<ul id="messages"></ul>

	<form>
		<input type="text" id="text_box"> <button> Send </button>
	</form>	

<script src="/socket.io/socket.io.js"></script>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script>
	var socket = io();

	$('form').submit(function() {
		socket.emit('newMessage', $('#text_box').val());
		$('#text_box').val('');
		return false;
	});

	// Show Mesage
	socket.on('newMessage', function(msg) {
		$('#messages').append($('<li>').text(msg));
	});
</script>

</body>
</html>
